services:
  postgres:
    image: postgres:16
    container_name: bdt_postgres
    environment:
      POSTGRES_DB: bigdata
      POSTGRES_USER: bigdata
      POSTGRES_PASSWORD: bigdata
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./исходные данные:/data:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bigdata -d bigdata"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: bdt_clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: bigdata
      CLICKHOUSE_PASSWORD: bigdata
    ports:
      - "18123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./исходные данные:/data:ro
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "bigdata", "--password", "bigdata", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  trino:
    image: trinodb/trino:481
    container_name: bdt_trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc/catalog:/etc/trino/catalog:ro
      - ./sql:/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  postgres_data:
  clickhouse_data:
